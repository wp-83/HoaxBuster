<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="home">
      <div class="div">
        <div class="frame"><div class="text-wrapper">Basmi Hoax, Temukan Kepastian!</div></div>
        <div class="component"><div class="button-name">MULAI SEKARANG!</div></div>
        <div class="overlap">
          <div class="group">
            <div class="overlap-group">
              <div class="rectangle"></div>
              <div class="rectangle-2"></div>
              <div class="hoaxbuster">
                HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster&nbsp;&nbsp;HoaxBuster
              </div>
            </div>
          </div>
          <div class="rectangle-3"></div>
        </div>
        <div class="form-section">
          <input type="text" class="form-input" placeholder="Masukkan informasi yang ingin dicek kebenarannya... " />
        </div>
        <footer class="footer">
          <div class="footer-left">
            <img src="../img/logo.png" alt="HoaxBuster Logo" class="footer-logo" />
            <div class="text-wrapper-2">© 2025 - HoaxBuster</div>
          </div>
          <div class="footer-right">
            <i class="fab fa-facebook-f"></i>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-twitter"></i>
            <i class="fab fa-tiktok"></i>
            <i class="fab fa-youtube"></i>
          </div>
        </footer>
        <div class="frame-3">
          <img class="garuda" src="../img/garuda-2.png" />
          <div class="navbar">
            <a href="../home/index.html">
              <button class="button-classic">
                <div class="line-css"></div> <button class="classic-button">Home</button>
              </button>
            </a>
            <div class="classic-button-wrapper">
              <div class="classic-button-2">Recent Activity</div>
            </div>
            <div class="div-wrapper">
              <div class="classic-button-2">About Us</div>
            </div>
          </div>
          <div class="frame-4">
            <div class="mdi-clock-outline"><i class="fas fa-clock"></i></div>
            <div class="text-wrapper-3">08:31:22 WIB</div>
          </div>
        </div>
        <div class="vertikal-logo">
          <div class="text-wrapper-4">HoaxBuster</div>
          <img src="../img/logo.png" alt="HoaxBuster Logo" class="main-logo-img" />
        </div>
        <div class="text-wrapper-5">Mau periksa informasi apa?</div>
        <div class="button-name-wrapper"><div class="button-name-2">Mulai Analisis!</div></div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
